  *{box-sizing:border-box}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
  a{color:inherit}
  .wrap{width:min(1100px,100% - 32px);margin-inline:auto}

  /* ---------- Brand header: just the wordmark ---------- */
  .hero{background:var(--navy);color:var(--cream);padding:46px 0 0;text-align:center}
  .hero h1{margin:0}
  .wordmark{display:block;width:min(300px,72vw);height:auto;margin:0 auto;animation:rise .8s ease-out both}
  .hero p{margin:22px 0 0;font-size:15px;color:#c3cbd1;animation:rise .8s .15s ease-out both}
  .seam{height:0;border-top:2px dashed rgba(240,235,220,.5);width:0;margin:34px auto 0;animation:sew 1.4s .45s ease-out forwards}
  .hero-end{height:26px}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes sew{to{width:100%}}

  /* ---------- Sticky category bar ---------- */
  .bar{position:sticky;top:0;z-index:10;background:rgba(246,243,234,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .bar-in{display:flex;align-items:center;height:var(--bar)}
  .bar-seal{flex:0 0 auto;width:0;height:36px;opacity:0;background:var(--navy) var(--seal) center/78% no-repeat;border-radius:50%;border:0;padding:0;cursor:pointer;transition:width .35s ease, opacity .35s ease, margin .35s ease}
  .bar.on .bar-seal{width:36px;opacity:1;margin-right:12px}
  .chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1;padding:4px 0}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;font:inherit;font-weight:600;font-size:13.5px;padding:9px 15px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;transition:background .2s,color .2s,border-color .2s}
  .chip.active{background:var(--navy);border-color:var(--navy);color:var(--cream)}
  .chip:focus-visible,.bar-seal:focus-visible,.card:focus-visible{outline:3px solid rgba(42,60,80,.45);outline-offset:2px}

  /* ---------- Sections ---------- */
  main{padding:10px 0 40px}
  .group{padding-top:34px;scroll-margin-top:var(--bar)}
  .group h2{font-family:var(--display);font-weight:700;font-size:clamp(22px,4vw,28px);line-height:1.15;margin:0;display:flex;align-items:baseline;gap:10px}
  .group h2 small{font-family:var(--body);font-size:13px;font-weight:500;color:var(--ink-soft)}
  .stitch{height:0;border-top:2px dashed var(--stitch);width:0;margin:10px 0 18px;transition:width 1s ease-out}
  .group.in .stitch{width:100%}
  .grid{display:grid;gap:18px 14px;grid-template-columns:repeat(2,1fr)}
  @media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:22px 18px}}
  @media(min-width:960px){.grid{grid-template-columns:repeat(4,1fr)}}

  /* ---------- Catalogue card: the cover is the hero of each card ---------- */
  .card{display:block;text-decoration:none;-webkit-tap-highlight-color:transparent}
  .cover{display:block;position:relative;aspect-ratio:4/5;border-radius:10px;overflow:hidden;background:#e7e1d0;box-shadow:0 1px 2px rgba(30,45,62,.12),0 6px 16px rgba(30,45,62,.08);transition:transform .25s ease, box-shadow .25s ease}
  .cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;opacity:0;transition:opacity .4s ease}
  .cover.ready img{opacity:1}
  .cover::after{content:"";position:absolute;inset:0;border-radius:10px;box-shadow:inset 0 0 0 1px rgba(30,45,62,.1);pointer-events:none}
  .cover.nocover{background:var(--navy)}
  .cover.nocover img{display:none}
  .cover.nocover::before{content:"";position:absolute;inset:10px;border:1.5px dashed rgba(240,235,220,.55);border-radius:6px;background:var(--seal) center/46% no-repeat}
  .card:hover .cover{transform:translateY(-4px);box-shadow:0 2px 4px rgba(30,45,62,.14),0 14px 28px rgba(30,45,62,.18)}
  .card:active .cover{transform:scale(.98)}
  .card strong{display:block;font-family:var(--display);font-weight:600;font-size:15px;line-height:1.25;margin-top:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .meta{display:block;font-size:12.5px;color:var(--ink-soft);margin-top:2px}

  /* ---------- Footer ---------- */
  footer{background:var(--navy);color:#c3cbd1;padding:44px 0 36px;text-align:center}
  .seal{width:92px;height:92px;margin:0 auto 14px;background:var(--seal) center/contain no-repeat}
  footer p{margin:0;font-size:14px}
  .contact{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
  .contact:empty{display:none}
  .contact a{text-decoration:none;font-weight:600;font-size:14px;padding:11px 18px;border-radius:999px;background:var(--cream);color:var(--navy-deep)}
  .contact a.alt{background:transparent;color:var(--cream);border:1.5px solid #6c7b8c}
  .fine{margin-top:26px;font-size:12px;color:#8e9baa}

  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    .wordmark,.hero p{animation:none}
    .seam{animation:none;width:100%}
    .stitch{width:100%;transition:none}
    .cover,.cover img,.bar-seal{transition:none}
  }
</style>

<nav class="bar" id="bar" aria-label="Catalogue categories">
  <div class="wrap bar-in">
    <button class="bar-seal" id="toTop" type="button" aria-label="Back to top"></button>
    <div class="chips" id="chips"></div>

<main>
  <div class="wrap" id="groups"></div>
</main>

<footer>
  <div class="wrap">
    <div class="seal" role="img" aria-label="The Ace Apparel Uniform Company"></div>
    <p>Uniforms since 1991</p>
    <div class="contact" id="contact"></div>
    <div class="fine">&copy; <span id="yr"></span> Ace Apparel, by The Bombay Hosiery Shop</div>
  </div>
</footer>

<script>
/* ===== EDIT THIS: contact details shown in the footer. Leave blank to hide a button. ===== */
const CONTACT = {
  whatsapp: "919822325928",
  phone: "+919822325928",
  email: "aceapparel91@gmail.com"
};

/* ===== Catalogue data. size is in bytes. ===== */
const FILE  = id => "https://drive.google.com/file/d/" + id + "/view?usp=drivesdk";
const COVER = id => "https://drive.google.com/thumbnail?id=" + id + "&sz=w500"; /* fallback: Drive page 1 */
const SLUG  = n => n.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
/* Covers load from covers/<name>.jpg (page 2). If missing, try Drive's page 1, then show the seal card. */
function coverFail(img){
  if(img.dataset.fb){ const s = img.dataset.fb; img.dataset.fb = ""; img.src = s; }
  else img.parentNode.classList.add("nocover");
}
const CATS = [
  { key:"aprons",   name:"Aprons" },
  { key:"chef",     name:"Chef coats" },
  { key:"shirts",   name:"Shirts" },
  { key:"tshirts",  name:"T-shirts" },
  { key:"workwear", name:"Workwear" },
  { key:"footwear", name:"Footwear" },
  { key:"colours",  name:"Colour chart" }
];
const ITEMS = [
  { cat:"aprons",   name:"Basic Aprons",                      id:"1GcWVtgC6wPMy7tusjxHLeoTzlJGk7VIx", size:32816761 },
  { cat:"aprons",   name:"Essential All Aprons",              id:"1NOpz_VGLe2eWCzjqgSFNqenE7ddEeo6S", size:49460438 },
  { cat:"aprons",   name:"Essential Waist Aprons",            id:"17y9BNVK74ynVf09iLjMBjW4bcm4M6KPG", size:22421031 },
  { cat:"aprons",   name:"Urban Aprons",                      id:"1BqCEk6WSYzKSFQs2lM_w-W8l5Cr14zNG", size:33687652 },
  { cat:"aprons",   name:"Denim Aprons",                      id:"1lgEDBYcwzFwX5Z6In6yr6vwX12xFqEBa", size:29112505 },
  { cat:"chef",     name:"Basic Chef Coats",                  id:"12WY3qS_qzDJfSiS0LSA4oK8UxBQNGkqc", size:46902363 },
  { cat:"shirts",   name:"Formal Women's Cotton Rich Shirts", id:"1woWYIQfLFcwvsZ5a3mUI5bndQr-wKFx5", size:14048012 },
  { cat:"shirts",   name:"Formal Men's Cotton Rich Shirts",   id:"1nRETjugyJESkzeaJ9PiGRQEazfpqqwNo", size:18381768 },
  { cat:"shirts",   name:"Formal Shirts",                     id:"1ADZPzocnbGe1ohqA4lMM_3oktsbYYJtI", size:569264 },
  { cat:"shirts",   name:"Shirts",                            id:"1Asn-WOog7BstjmB3ISPSC-oBC88SgyZj", size:29861771 },
  { cat:"tshirts",  name:"All T-shirts",                      id:"1xKArQwcUhaQz2QVFEG4eU5dbRImc5z_b", size:845464 },
  { cat:"tshirts",  name:"Polo Collar T-shirts, 180 GSM",     id:"1wu68ahizLm-_zHyD083TJeDb9uPiLOIC", size:611168 },
  { cat:"tshirts",  name:"Men's Oversized T-shirts, 240 GSM", id:"1b5-CFg3AeB7YZNLDHTgnWKsfHSG47K01", size:919447 },
  { cat:"workwear", name:"Security Uniforms",                 id:"14jkNYwnWFxAPVwmgyvqZjgV_eyjFbN5Y", size:10624558 },
  { cat:"workwear", name:"Workers Uniforms",                  id:"1HzxVybXD4fEpibinin_KuSpWMK6c2uRb", size:737381 },
  { cat:"workwear", name:"Spa, Salon & Housekeeping",         id:"1rYvaWoXFRtFyvZNukxMGxulagbYMX2EX", size:2246364 },
  { cat:"footwear", name:"Shoes",                             id:"1mPI2zucLsLCHxEppQRpl7KRg6Bl15UV9", size:562722 },
  { cat:"colours",  name:"Colour Chart",                      id:"1gMHw9pqhoMwgikceJDSorBbqFZohGkie", size:938489 }
];

const fmt = b => b >= 1048576 ? (b/1048576).toFixed(1) + " MB" : Math.max(1, Math.round(b/1024)) + " KB";
const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const chipsEl = document.getElementById("chips");
const groupsEl = document.getElementById("groups");

chipsEl.innerHTML = CATS.map(c => `<a class="chip" href="#${c.key}" data-k="${c.key}">${esc(c.name)}</a>`).join("");
groupsEl.innerHTML = CATS.map(c => {
  const items = ITEMS.filter(i => i.cat === c.key);
  const cards = items.map(i => `<a class="card" href="${FILE(i.id)}" target="_blank" rel="noopener">
      <span class="cover"><img src="covers/${SLUG(i.name)}.jpg" data-fb="${COVER(i.id)}" alt="" loading="lazy" referrerpolicy="no-referrer"
        onload="this.parentNode.classList.add('ready')" onerror="coverFail(this)"></span>
      <strong>${esc(i.name)}</strong><span class="meta">${fmt(i.size)}</span>
    </a>`).join("");
  return `<section class="group" id="${c.key}" aria-labelledby="h-${c.key}">
    <h2 id="h-${c.key}">${esc(c.name)} <small>${items.length}</small></h2>
    <div class="stitch" aria-hidden="true"></div>
    <div class="grid">${cards}</div>
  </section>`;
}).join("");

/* Cached images can finish before the onload attribute runs. */
document.querySelectorAll(".cover img").forEach(img => { if(img.complete && img.naturalWidth) img.parentNode.classList.add("ready"); });

/* Highlight the category in view and keep its chip centred in the bar. */
const chips = [...chipsEl.querySelectorAll(".chip")];
let current = null;
function setActive(key){
  if(key === current) return; current = key;
  chips.forEach(c => c.classList.toggle("active", c.dataset.k === key));
  const el = chips.find(c => c.dataset.k === key);
  if(el) chipsEl.scrollTo({ left: el.offsetLeft - (chipsEl.clientWidth - el.offsetWidth)/2, behavior: "smooth" });
}
const sections = [...document.querySelectorAll(".group")];
if("IntersectionObserver" in window){
  const spy = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting) setActive(e.target.id); }),
    { rootMargin: "-30% 0px -60% 0px" });
  const draw = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ e.target.classList.add("in"); draw.unobserve(e.target); } }),
    { rootMargin: "0px 0px -12% 0px" });
  sections.forEach(s => { spy.observe(s); draw.observe(s); });
} else { sections.forEach(s => s.classList.add("in")); }

/* Brand mark slides into the bar once the header has scrolled away. */
const bar = document.getElementById("bar");
if("IntersectionObserver" in window){
  new IntersectionObserver(([e]) => bar.classList.toggle("on", !e.isIntersecting)).observe(document.querySelector(".hero-end"));
}
document.getElementById("toTop").addEventListener("click", () => window.scrollTo({ top:0, behavior:"smooth" }));

(function contact(){
  const el = document.getElementById("contact"), out = [];
  if(CONTACT.whatsapp) out.push(`<a href="https://wa.me/${CONTACT.whatsapp.replace(/\D/g,"")}">Chat on WhatsApp</a>`);
  if(CONTACT.phone)    out.push(`<a class="alt" href="tel:${CONTACT.phone}">Call us</a>`);
  if(CONTACT.email)    out.push(`<a class="alt" href="mailto:${CONTACT.email}">Email us</a>`);
  el.innerHTML = out.join("");
})();
document.getElementById("yr").textContent = new Date().getFullYear();
</script>
